services:
  rpms:
    restart: 'unless-stopped'
    tty: true
    build:
      context: .
      args:
        CACHE_BUST: ${CACHE_BUST:-1}
    environment:
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_OPTIONS: --max-old-space-size=384
      DATABASE_URL: ${DATABASE_URL:-mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}}
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      DATABASE_NAME: ${MYSQL_DATABASE}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_ENABLED: ${DISCORD_WEBHOOK_ENABLED:-false}
      DISCORD_WEBHOOK_USERNAME: ${DISCORD_WEBHOOK_USERNAME:-RPMS}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    cpus: 1.0
    mem_limit: 384m
    command: >
      sh -c "pnpm exec prisma db push --accept-data-loss && pnpm run start"

  db:
    image: 'mysql:8.4'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u${MYSQL_USER} -p${MYSQL_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - db:/var/lib/mysql

volumes:
  db:
    driver: local
